name: All Core releases
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        core: [mgba, mesen, bsnes, ppsspp]
    uses: ./.github/workflows/release.yml
    with:
      core: ${{ matrix.core }}
    permissions:
      contents: write
