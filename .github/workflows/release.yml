name: Core release
on:
  workflow_dispatch:
    inputs:
      core:
        description: 已登记 Core
        type: choice
        options: [mgba, mesen, bsnes, ppsspp]
        default: mgba
  workflow_call:
    inputs:
      core:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      update: ${{ steps.check.outputs.update }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - run: mise run test
      - id: check
        env:
          CORE: ${{ inputs.core }}
          GH_TOKEN: ${{ github.token }}
        run: mise run core-release -- check "$CORE"
      - if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ inputs.core }}
          CORE_VERSION: ${{ steps.check.outputs.version }}
          CART_VERSION: ${{ steps.check.outputs.cart_version }}
        run: mise run core-release -- prepare "$CORE" "$CORE_VERSION" --cart-version "$CART_VERSION"
      - if: steps.check.outputs.update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: input-lock-${{ inputs.core }}
          path: input-lock.json
          if-no-files-found: error
  build:
    needs: check
    if: needs.check.outputs.update == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-lock-${{ inputs.core }}
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          echo 'CC=gcc-13' >> "$GITHUB_ENV"
          echo 'CXX=g++-13' >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev
      - name: Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'VSINSTALLDIR')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: GNU make and MinGW for upstream Make recipes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed make mingw-w64-x86_64-gcc mingw-w64-x86_64-libgomp'
          'C:/msys64/usr/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and native ABI verification
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TARGET: ${{ matrix.target }}
          CORE: ${{ inputs.core }}
        shell: bash
        run: mise run core-release -- build input-lock.json "$CORE_TARGET" --core "$CORE" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ inputs.core }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    concurrency:
      group: core-publish-${{ inputs.core }}
      cancel-in-progress: false
    needs: [check, build]
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-${{ inputs.core }}-*
          path: dist
          merge-multiple: true
      - env:
          CORE: ${{ inputs.core }}
        run: mise run core-release -- verify dist --core "$CORE"
      - env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ inputs.core }}
        run: mise run core-release -- publish dist --core "$CORE"
